name: Optimize Images & Update Gallery

on:
  push:
    branches:
      - main
      - master
    paths:
      - "assets/**"
      - "scripts/generate-gallery.py"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Convert images to WebP and update gallery
        run: |
          python scripts/generate-gallery.py

      - name: Commit optimized images and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets gallery-data.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: optimize images and update gallery"
            git push
          fi
